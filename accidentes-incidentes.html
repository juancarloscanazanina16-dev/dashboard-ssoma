<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accidentes e Incidentes · SSOMA CONTROL 2.0</title><link rel="stylesheet" href="ssoma-events.css"><style>body{font:14px system-ui,Arial;background:#f3f7fb;color:#173b53;margin:0}header.top{background:#123a54;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header.top a{color:white}main{max-width:1200px;margin:25px auto;padding:0 15px}.btn{border:1px solid #cddce7;border-radius:8px;background:#fff;padding:10px 13px;cursor:pointer;color:#173b53}.btn.green{background:#087e83;color:#fff;border-color:#087e83}.btn.light{background:#eef5f8}.ev-form input,.ev-form select,.ev-form textarea,#ev-select{padding:10px;border:1px solid #cbd8e5;border-radius:8px;width:100%;box-sizing:border-box;background:white}.ev-form label{font-weight:600;font-size:12px}.login{max-width:380px;margin:70px auto;background:white;padding:24px;border-radius:14px;box-shadow:0 6px 25px #1234}.login input{display:block;width:100%;box-sizing:border-box;margin:8px 0 14px;padding:12px;border:1px solid #ccd8e4;border-radius:8px}.hidden{display:none!important}#notice{position:fixed;right:15px;bottom:15px;max-width:420px;background:#173b53;color:white;padding:14px;border-radius:10px;display:none;z-index:10}</style></head><body><header class="top"><strong>SSOMA CONTROL 2.0 · Accidentes e Incidentes</strong><span><a href="./">Volver al panel principal</a>　<button id="logout" class="btn hidden">Cerrar sesión</button></span></header><section id="login" class="login"><h2>Acceso SSOMA</h2><p>Utiliza las credenciales de tu plataforma.</p><form id="login-form"><label>Correo electrónico<input type="email" id="email" required autocomplete="username"></label><label>Contraseña<input type="password" id="password" required autocomplete="current-password"></label><button class="btn green">Ingresar</button></form></section><main id="app" class="hidden"></main><div id="notice" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="ssoma-events.js"></script><script>(function(){const c=window.SSOMA_CONFIG,db=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey),$=id=>document.getElementById(id);let state={contractors:[],personnel:[]};function toast(m,bad){const n=$('notice');n.textContent=m;n.style.background=bad?'#9f2835':'#173b53';n.style.display='block';}async function show(session){$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);$('logout').classList.toggle('hidden',!session);if(!session)return;try{const [a,b]=await Promise.all([db.from('contractors').select('*').limit(5000),db.from('personnel').select('*').limit(10000)]);if(a.error)throw a.error;if(b.error)throw b.error;state={contractors:a.data,personnel:b.data};$('app').innerHTML=window.ssomaEvents.page({db,state,toast})}catch(e){toast('No se pudieron cargar los datos: '+e.message,true)}}$('login-form').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)toast(r.error.message,true);else show(r.data.session)};$('logout').onclick=async()=>{await db.auth.signOut();show(null)};db.auth.getSession().then(r=>{if(r.error)toast(r.error.message,true);else show(r.data.session)})})();</script></body></html>
